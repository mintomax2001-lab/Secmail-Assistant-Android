name: Build Secmail Reply Assistant v0.8 Lite

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Secmail_Reply_Assistant_v0.8_Lite_source.zip'
      - '.github/workflows/build-secmail-v0.8-lite-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract v0.8 Lite source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Secmail_Assistant_v0.8_Lite
          unzip -q Secmail_Reply_Assistant_v0.8_Lite_source.zip
          test -f Secmail_Assistant_v0.8_Lite/settings.gradle
          test -f Secmail_Assistant_v0.8_Lite/app/build.gradle

      - name: Build debug APK
        working-directory: Secmail_Assistant_v0.8_Lite
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          SRC="Secmail_Assistant_v0.8_Lite/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$SRC"
          OUT="out/Secmail_Reply_Assistant_v0.8.0.apk"
          cp "$SRC" "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee out/APK_BADGING.txt
          grep -q "package: name='com.mintomax.secmailprobe'" out/APK_BADGING.txt
          grep -q "versionCode='10'" out/APK_BADGING.txt
          grep -q "versionName='0.8.0'" out/APK_BADGING.txt
          sha256sum "$OUT" | tee out/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Secmail_Reply_Assistant_v0.8.0_APK
          path: |
            out/Secmail_Reply_Assistant_v0.8.0.apk
            out/APK_BADGING.txt
            out/SHA256.txt
          if-no-files-found: error
          retention-days: 14
