name: Build Secmail Reader Probe APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Secmail_Reader_Probe_v0.7/**'
      - '.github/workflows/build-secmail-probe.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Secmail_Reader_Probe_v0.7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Secmail_Reader_Probe_v0.7.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/Secmail_Reader_Probe_v0.7.apk | tee out/APK_BADGING.txt
          grep -q "package: name='com.mintomax.secmailprobe'" out/APK_BADGING.txt
          sha256sum out/Secmail_Reader_Probe_v0.7.apk | tee out/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Secmail_Reader_Probe_v0.7_APK
          path: |
            Secmail_Reader_Probe_v0.7/out/Secmail_Reader_Probe_v0.7.apk
            Secmail_Reader_Probe_v0.7/out/SHA256.txt
            Secmail_Reader_Probe_v0.7/out/APK_BADGING.txt
          if-no-files-found: error
          retention-days: 14
