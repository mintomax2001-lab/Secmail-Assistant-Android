name: Build Secmail Reply Assistant v0.8.8 Compatibility

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '1_Secmail_v08_source.zip'
      - '.github/workflows/build-v088-compat.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract v0.8 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Secmail_Assistant_v0.8_Lite
          unzip -q 1_Secmail_v08_source.zip
          test -f Secmail_Assistant_v0.8_Lite/settings.gradle
          test -f Secmail_Assistant_v0.8_Lite/app/build.gradle

      - name: Apply v0.8.8 compatibility patch
        shell: bash
        env:
          PATCH_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/v088_patch.py
          python3 /tmp/v088_patch.py Secmail_Assistant_v0.8_Lite

      - name: Apply v0.8.8 diagnostics
        shell: bash
        env:
          DIAGNOSTICS_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$DIAGNOSTICS_B64" | base64 -d > /tmp/diagnostics83.py
          python3 /tmp/diagnostics83.py Secmail_Assistant_v0.8_Lite

      - name: Apply v0.8.8 Lite improvements
        shell: bash
        env:
          IMPROVEMENTS_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$IMPROVEMENTS_B64" | base64 -d > /tmp/improvements84.py
          python3 /tmp/improvements84.py Secmail_Assistant_v0.8_Lite

      - name: Apply v0.8.8 image review and title update
        shell: bash
        env:
          IMAGES_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$IMAGES_B64" | base64 -d > /tmp/images85.py
          python3 /tmp/images85.py Secmail_Assistant_v0.8_Lite

      - name: Apply v0.8.8 project link integration
        shell: bash
        env:
          PROJECT_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PROJECT_B64" | base64 -d > /tmp/project86.py
          python3 /tmp/project86.py Secmail_Assistant_v0.8_Lite

      - name: Apply v0.8.8 incoming image sharing
        shell: bash
        env:
          RECEIVER_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$RECEIVER_B64" | base64 -d > /tmp/receive87.py
          python3 /tmp/receive87.py Secmail_Assistant_v0.8_Lite

      - name: Apply v0.8.8 screenshot trial and bilingual reply
        shell: bash
        env:
          TRIAL_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$TRIAL_B64" | base64 -d > /tmp/trial88.py
          python3 /tmp/trial88.py Secmail_Assistant_v0.8_Lite

      - name: Build debug APK
        working-directory: Secmail_Assistant_v0.8_Lite
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          SRC="Secmail_Assistant_v0.8_Lite/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$SRC"
          OUT="out/Secmail_Reply_Assistant_v0.8.8_Compat.apk"
          cp "$SRC" "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee out/APK_BADGING.txt
          grep -q "package: name='com.mintomax.secmailprobe'" out/APK_BADGING.txt
          grep -q "versionCode='18'" out/APK_BADGING.txt
          grep -q "versionName='0.8.8'" out/APK_BADGING.txt
          if unzip -l "$OUT" | grep -qi "libtranslate_jni"; then
            echo "ERROR: ML Kit translate native library still present"
            exit 1
          fi
          sha256sum "$OUT" | tee out/SHA256.txt
          stat -c '%s' "$OUT" | tee out/APK_SIZE_BYTES.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Secmail_Reply_Assistant_v0.8.8_Compat_APK
          path: |
            out/Secmail_Reply_Assistant_v0.8.8_Compat.apk
            out/APK_BADGING.txt
            out/SHA256.txt
            out/APK_SIZE_BYTES.txt
          if-no-files-found: error
          retention-days: 14



